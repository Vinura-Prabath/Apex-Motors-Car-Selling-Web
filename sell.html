<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Motors | Sell / Trade Your Vehicle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-danger" href="index.html"><i class="bi bi-speedometer2"></i> APEX MOTORS</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="inventory.html">Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="details.html">Vehicle Details</a></li>
          <li class="nav-item"><a class="nav-link active" href="sell.html">Sell / Trade</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card p-4 border-0 shadow-sm">
          <h2 class="fw-bold mb-2 text-center">Sell or Trade Your Vehicle</h2>
          <p class="text-muted text-center mb-4">Receive an instant valuation offer within 24 hours.</p>

          <form class="needs-validation" novalidate>
            <!-- Vehicle Info -->
            <h5 class="fw-bold border-bottom pb-2 mb-3 text-danger">1. Vehicle Details</h5>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label">Year</label>
                <input type="number" class="form-control" placeholder="e.g. 2021" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Make</label>
                <input type="text" class="form-control" placeholder="e.g. BMW" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Model</label>
                <input type="text" class="form-control" placeholder="e.g. M3" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Mileage</label>
                <input type="number" class="form-control" placeholder="e.g. 25000" required>
              </div>
            </div>

            <!-- Vehicle Condition -->
            <h5 class="fw-bold border-bottom pb-2 mb-3 text-danger">2. Condition & Photos</h5>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label">Overall Condition</label>
                <select class="form-select" required>
                  <option value="">Select condition...</option>
                  <option>Excellent (Like New)</option>
                  <option>Good (Minor Wear)</option>
                  <option>Fair (Needs Service)</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Upload Photos</label>
                <input type="file" class="form-control" multiple>
              </div>
            </div>

            <!-- Contact Info -->
            <h5 class="fw-bold border-bottom pb-2 mb-3 text-danger">3. Owner Contact Details</h5>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Phone Number</label>
                <input type="tel" class="form-control" required>
              </div>
              <div class="col-12">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" required>
              </div>
            </div>

            <button type="submit" class="btn btn-danger btn-lg w-100">Submit Vehicle Information</button>
          </form>

        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0">&copy; 2026 Apex Motors. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
